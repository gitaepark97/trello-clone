services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=trello_clone'
      - 'POSTGRES_USER=trello'
      - 'POSTGRES_PASSWORD=trello'
    ports:
      - '5432:5432'
    volumes:
      - 'trello-clone-postgres-data:/var/lib/postgresql/data'

volumes:
  trello-clone-postgres-data:
