schema: spec-driven

# 프로젝트 컨텍스트 (선택)
# 아티팩트를 생성할 때 AI에게 전달되는 내용입니다.
# 기술 스택, 컨벤션, 스타일 가이드, 도메인 지식 등을 적어두세요.
# 예시:
#   context: |
#     기술 스택: TypeScript, React, Node.js
#     커밋 컨벤션: conventional commits 사용
#     도메인: 이커머스 플랫폼
context: |
  언어: 모든 OpenSpec 아티팩트(proposal.md, specs/*.md, design.md, tasks.md)는 한국어로 작성한다. 코드 식별자, 파일 경로, 기술 용어는 평소처럼 영어를 유지하고, 설명글과 제목은 한국어로 작성한다.
  프로젝트: Trello 클론 (개인/학습 프로젝트)
  백엔드: Spring Boot 4, Gradle 빌드, PostgreSQL (언어는 Java 또는 Kotlin - 구현 시점에 결정, Spring Boot 4 기준 Java 17 이상 필요)
  프론트엔드: React (TypeScript)
  저장소 구조: 단일 모노레포, 프로젝트 루트에 backend/, frontend/ 디렉토리
  도메인: 보드, 리스트(컬럼), 카드, 드래그 앤 드롭 순서 변경, 사용자, 보드 멤버십
  단계: 그린필드 프로젝트로 아직 코드가 없음 - 구현 전에 스펙을 먼저 정의하는 중

# 아티팩트별 규칙 (선택)
# 특정 아티팩트에 대한 커스텀 규칙을 추가할 수 있습니다.
# 예시:
#   rules:
#     proposal:
#       - 제안서는 500단어 이내로 작성
#       - "Non-goals" 섹션을 항상 포함
#     tasks:
#       - 작업 단위를 최대 2시간 분량으로 나눔

# 작업별 가이드 (선택)
# apply, archive 작업을 어떻게 수행할지에 대한 참고용 가이드입니다.
# 위의 아티팩트 규칙과는 별개입니다.
# 예시:
#   operations:
#     apply:
#       guidance:
#         - 테스트 결과 요약은 간결하게 유지
#     archive:
#       guidance:
#         - 마무리 전에 아카이브 결과를 요약
